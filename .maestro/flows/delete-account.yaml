# Delete this run's account from Profile (both confirms), land on Welcome, and check the account
# is gone: signing in with it fails. Runs last, signed in as the user the first flow created.
appId: com.aabv21.dressingroom
---
- launchApp:
    stopApp: true
    arguments:
      "-e2e": "1"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 60000
- tapOn: "Profile"
# Centered, since the last rows can stop just under the floating tab bar, where a tap lands on a tab.
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: "Delete account"
- extendedWaitUntil:
    visible: "Delete your account\\?"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Are you sure\\?"
    timeout: 10000
- tapOn: "Delete forever"

# Signed out on Welcome.
- extendedWaitUntil:
    visible: "Create account"
    timeout: 60000

# The account no longer exists.
- tapOn: "I already have an account"
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 10000
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn: "Show password"
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- assertVisible: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "That email or password doesn't match."
    timeout: 30000
